enums:
  - name: PickingState
    description: "拣货单状态"
    state_machine: true
    default: Draft
    values:
      - name: Draft
        display: "草稿"
        description: "可自由编辑"
      - name: Waiting
        display: "等待中"
        description: "等待上游操作或库存"
      - name: Ready
        display: "就绪"
        description: "库存已预留，可执行"
      - name: Done
        display: "已完成"
        description: "终态"
      - name: Cancel
        display: "已取消"
        description: "可重新打开回草稿"
    transitions:
      - from: Draft
        to: [Waiting, Ready, Cancel]
      - from: Waiting
        to: [Ready, Cancel]
      - from: Ready
        to: [Done, Cancel]
      - from: Done
        to: []
      - from: Cancel
        to: [Draft]

  - name: MoveState
    description: "库存移动状态"
    state_machine: false
    values:
      - name: Draft
        display: "草稿"
      - name: Waiting
        display: "等待"
      - name: Confirmed
        display: "已确认"
      - name: Assigned
        display: "已分配"
      - name: Done
        display: "已完成"
      - name: Cancel
        display: "已取消"

  - name: LocationUsage
    description: "库位用途"
    state_machine: false
    values:
      - name: Supplier
        display: "供应商库位 (虚拟)"
      - name: Customer
        display: "客户库位 (虚拟)"
      - name: Internal
        display: "内部库位 (真实库存)"
      - name: Production
        display: "生产库位 (虚拟)"
      - name: Transit
        display: "中转库位"
      - name: Inventory
        display: "库存调整 (虚拟)"
      - name: View
        display: "视图 (仅分组)"

  - name: PickingTypeCode
    description: "拣货单类型代码"
    state_machine: false
    values:
      - name: Incoming
        display: "入库"
      - name: Outgoing
        display: "出库"
      - name: Internal
        display: "内部调拨"

