# ERP Project 模块 Tera 项目配置
# 版本: v1
# 描述: 项目模块 (Project, ProjectTask, Milestone, ProjectStage, TaskStage)
#
# 对应 Rust domain: core_rust/crates/libs/erp/erp_project/src/domain/entities/

module:
  name: erp_project
  schema: project
  display_name: "Project"
  description: "ERP 项目模块 — 项目、任务（子任务）、里程碑、阶段"

entities:
  # ─── Project (项目) ──────────────────────────────────
  - name: Project
    table: project.projects
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - Archive
      - Unarchive

    indexed_fields:
      - name
      - user_id
      - partner_id
      - stage_id
      - tenant_id
      - active

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Project ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "项目名称"
        searchable: true
        search_operator: "ILIKE"

      - name: description
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "项目描述"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      # ── 关联 ──
      - name: partner_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "客户"
        relation: base.partners

      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "项目经理"

      - name: stage_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "项目阶段"
        relation: project.project_stages

      # ── 配置 ──
      - name: label_tasks
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "任务标签名称"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色标识"

      - name: privacy_visibility
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "可见性"

      - name: date_start
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "开始日期"

      - name: date
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "截止日期"

      # ── 功能开关 ──
      - name: allow_task_dependencies
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "允许任务依赖"

      - name: allow_milestones
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "允许里程碑"

      - name: allow_recurring_tasks
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "允许循环任务"

      # ── 状态 ──
      - name: last_update_status
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "最新状态更新"

      - name: is_template
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否为模板"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── ProjectTask (项目任务，支持子任务) ──────────────────────────────────
  - name: ProjectTask
    table: project.tasks
    aggregate_root: true
    hierarchical: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - MarkDone
      - Cancel
      - Reopen

    computed_fields:
      - name: effective_hours
        description: "实际工时 (从 timesheet 汇总，域外提供)"
        depends_on: ["timesheets"]
      - name: remaining_hours
        description: "剩余工时 = allocated_hours - effective_hours"
        depends_on: ["allocated_hours", "effective_hours"]

    indexed_fields:
      - name
      - project_id
      - stage_id
      - state
      - parent_id
      - milestone_id
      - tenant_id

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "ProjectTask ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "任务名称"
        searchable: true
        search_operator: "ILIKE"

      - name: description
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "描述"

      - name: priority
        type: String
        rust_type: "TaskPriority"
        nullable: false
        default: "normal"
        description: "优先级 (normal/low/high/urgent)"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      # ── 阶段 & 状态 ──
      - name: stage_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "任务阶段"
        relation: project.task_types

      - name: state
        type: String
        rust_type: "TaskState"
        nullable: false
        default: "in_progress"
        description: "状态 (in_progress/done/cancelled)"

      # ── 日期 ──
      - name: date_end
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "完成日期"

      - name: date_assign
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "分配日期"

      - name: date_deadline
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "截止日期"

      # ── 关联 ──
      - name: project_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "所属项目"
        relation: project.projects

      - name: partner_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "客户"
        relation: base.partners

      - name: parent_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "父任务 (子任务自引用)"
        relation: project.tasks

      - name: milestone_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "里程碑"
        relation: project.milestones

      # ── 时间跟踪 ──
      - name: allocated_hours
        type: f64
        rust_type: "Option<f64>"
        nullable: true
        description: "计划工时"

      # ── 联系信息 ──
      - name: email_from
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "来源邮箱"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      - name: display_in_project
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "在项目中显示"

      # ── 循环任务 ──
      - name: recurring_task
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否循环任务"

      - name: recurrence_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "循环规则"

      - name: is_template
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否为模板"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── Milestone (里程碑) ──────────────────────────────────
  - name: Milestone
    table: project.milestones
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - Create
      - Update
      - Delete
      - MarkReached
      - UnmarkReached

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Milestone ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "里程碑名称"
        searchable: true
        search_operator: "ILIKE"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      - name: project_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "所属项目"
        relation: project.projects

      - name: deadline
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "截止日期"

      - name: is_reached
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "已达成"

      - name: reached_date
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "达成日期"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── ProjectStage (项目阶段/看板列) ──────────────────────────────────
  - name: ProjectStage
    table: project.project_stages
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "ProjectStage ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "阶段名称"

      - name: fold
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否折叠"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── TaskStage (任务阶段/看板列) ──────────────────────────────────
  - name: TaskStage
    table: project.task_types
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "TaskStage ID"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "阶段名称"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      - name: fold
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否折叠"

      - name: auto_validation_state
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "自动验证状态"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

enums:
  - name: TaskPriority
    description: "任务优先级"
    state_machine: false
    default: Normal
    values:
      - name: Normal
        display: "普通"
      - name: Low
        display: "低"
      - name: High
        display: "高"
      - name: Urgent
        display: "紧急"

  - name: TaskState
    description: "任务状态"
    state_machine: false
    default: InProgress
    values:
      - name: InProgress
        display: "进行中"
        db_value: "in_progress"
      - name: Done
        display: "已完成"
        db_value: "done"
      - name: Cancelled
        display: "已取消"
        db_value: "cancelled"

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
