# ERP CRM 模块 Tera 项目配置
# 版本: v1
# 描述: 客户关系管理模块 (Lead, CrmStage, LostReason, CrmTeam)
#
# 对应 Rust domain: core_rust/crates/libs/erp/erp_crm/src/domain/entities/

module:
  name: erp_crm
  schema: crm
  display_name: "CRM"
  description: "ERP CRM 模块 — 线索/商机、管道阶段、输单原因、销售团队"

entities:
  # ─── Lead (线索/商机) ──────────────────────────────────
  - name: Lead
    table: crm.leads
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - MarkWon
      - MarkLost
      - Reopen
      - ConvertToOpportunity

    computed_fields:
      - name: prorated_revenue
        description: "加权收入 = expected_revenue * probability / 100"
        depends_on: ["expected_revenue", "probability"]
      - name: day_open
        description: "从创建到分配的天数"
        depends_on: ["created_at", "date_open"]
      - name: day_close
        description: "从创建到关闭的天数"
        depends_on: ["created_at", "date_closed"]

    indexed_fields:
      - name
      - lead_type
      - stage_id
      - user_id
      - team_id
      - partner_id
      - won_status
      - tenant_id
      - active

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Lead ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "线索名称"
        searchable: true
        search_operator: "ILIKE"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: lead_type
        type: String
        rust_type: "LeadType"
        nullable: false
        default: "lead"
        description: "类型 (lead/opportunity)"

      - name: priority
        type: String
        rust_type: "LeadPriority"
        nullable: false
        default: "normal"
        description: "优先级 (normal/low/high/very_high)"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      - name: description
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "描述"

      - name: referred
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "推荐人"

      # ── 管道 ──
      - name: stage_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "管道阶段"
        relation: crm.stages

      - name: probability
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "赢单概率 (0-100)"

      - name: automated_probability
        type: f64
        rust_type: "Option<f64>"
        nullable: true
        description: "AI 预测概率"

      - name: won_status
        type: String
        rust_type: "WonStatus"
        nullable: false
        default: "pending"
        description: "赢单状态 (pending/won/lost)"

      - name: lost_reason_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "输单原因"
        relation: crm.lost_reasons

      # ── 金额 ──
      - name: expected_revenue
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "期望收入"

      - name: prorated_revenue
        type: Decimal
        rust_type: "Option<rust_decimal::Decimal>"
        nullable: true
        description: "加权收入"

      - name: recurring_revenue
        type: Decimal
        rust_type: "Option<rust_decimal::Decimal>"
        nullable: true
        description: "经常性收入"

      - name: recurring_revenue_monthly
        type: Decimal
        rust_type: "Option<rust_decimal::Decimal>"
        nullable: true
        description: "月度经常性收入"

      # ── 关联 ──
      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "销售员"

      - name: team_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "销售团队"
        relation: crm.teams

      - name: partner_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "联系人"
        relation: base.partners

      - name: commercial_partner_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "客户公司"
        relation: base.partners

      # ── 日期 ──
      - name: date_open
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "分配日期"

      - name: date_closed
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "关闭日期"

      - name: date_deadline
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "预计关闭日期"

      - name: date_conversion
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "转化日期"

      - name: date_last_stage_update
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "最后阶段变更日期"

      # ── 联系信息 ──
      - name: contact_name
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "联系人姓名"

      - name: partner_name
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "公司名称"

      - name: function
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "职位"

      - name: email_from
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "邮箱"
        searchable: true
        search_operator: "ILIKE"

      - name: phone
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "电话"
        searchable: true
        search_operator: "ILIKE"

      - name: website
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "网站"

      # ── 地址 ──
      - name: city
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "城市"

      - name: country_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "国家"
        relation: base.countries

      # ── UTM ──
      - name: campaign_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "营销活动"

      - name: medium_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "媒介"

      - name: source_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "来源"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── CrmStage (管道阶段) ──────────────────────────────────
  - name: CrmStage
    table: crm.stages
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "CrmStage ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "阶段名称"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      - name: is_won
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否为赢单阶段"

      - name: rotting_threshold_days
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "停滞预警天数"

      - name: requirements
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "阶段要求说明"

      - name: fold
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否折叠"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── LostReason (输单原因) ──────────────────────────────────
  - name: LostReason
    table: crm.lost_reasons
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "LostReason ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "原因名称"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── CrmTeam (销售团队) ──────────────────────────────────
  - name: CrmTeam
    table: crm.teams
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "CrmTeam ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "团队名称"
        searchable: true
        search_operator: "ILIKE"

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "团队负责人"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

enums:
  - name: LeadType
    description: "Lead/Opportunity 类型"
    state_machine: false
    default: Lead
    values:
      - name: Lead
        display: "线索"
      - name: Opportunity
        display: "商机"

  - name: LeadPriority
    description: "线索优先级 (星级)"
    state_machine: false
    default: Normal
    values:
      - name: Normal
        display: "普通"
      - name: Low
        display: "低"
      - name: High
        display: "高"
      - name: VeryHigh
        display: "非常高"
        db_value: "very_high"

  - name: WonStatus
    description: "赢单/输单状态"
    state_machine: false
    default: Pending
    values:
      - name: Pending
        display: "待定"
      - name: Won
        display: "赢单"
      - name: Lost
        display: "输单"

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
