# ERP Purchase 模块 Tera 项目配置
# 版本: v1
# 描述: 采购模块 (PurchaseOrder, PurchaseOrderLine, PurchaseOrderState)
#
# 对应 Rust domain: core_rust/crates/libs/erp/erp_purchase/src/domain/entities/

module:
  name: erp_purchase
  schema: purchase
  display_name: "Purchase"
  description: "ERP 采购模块 — 采购订单、订单行、状态机"

entities:
  # ─── PurchaseOrder (采购订单聚合根) ──────────────────────────────────
  - name: PurchaseOrder
    table: purchase.orders
    aggregate_root: true
    pattern: header-line
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - Confirm
      - Cancel

    domain_events:
      - PurchaseOrderConfirmed
      - PurchaseOrderCancelled

    computed_fields:
      - name: amount_untaxed
        description: "不含税合计 = Σ line.price_subtotal"
        depends_on: ["lines.price_subtotal"]
      - name: amount_tax
        description: "税额 = Σ line.price_tax"
        depends_on: ["lines.price_tax"]
      - name: amount_total
        description: "含税合计 = amount_untaxed + amount_tax"
        depends_on: ["amount_untaxed", "amount_tax"]
      - name: amount_total_cc
        description: "公司币种合计"
        depends_on: ["amount_total", "currency_rate"]

    indexed_fields:
      - name
      - partner_id
      - state
      - date_order
      - tenant_id
      - user_id

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        primary_key: true
        description: "PurchaseOrder ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        flutter_type: "String"
        nullable: false
        description: "订单编号 (PO/2026/00001)"
        searchable: true
        search_operator: "ILIKE"

      - name: priority
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "优先级"

      - name: origin
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "来源单据"

      - name: partner_ref
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "供应商参考号"

      - name: partner_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "供应商"
        relation: base.partners

      - name: state
        type: String
        rust_type: "PurchaseOrderState"
        flutter_type: "String"
        nullable: false
        default: "draft"
        description: "状态 (draft/confirmed/done/cancel)"

      - name: locked
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "已锁定标志"

      - name: acknowledged
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "供应商已确认"

      - name: date_order
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "订单日期"

      - name: date_approve
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        flutter_type: "DateTime?"
        nullable: true
        description: "审批日期"

      - name: date_planned
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        flutter_type: "DateTime?"
        nullable: true
        description: "计划到达日期"

      - name: note
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "备注"

      - name: dest_address_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "直发地址"

      - name: currency_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "币种"
        relation: base.currencies

      - name: currency_rate
        type: f64
        rust_type: "Option<f64>"
        flutter_type: "double?"
        nullable: true
        description: "汇率"

      - name: fiscal_position_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "财务位置"

      - name: payment_term_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "付款条件"

      - name: incoterm_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "贸易术语"

      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "采购员"

      # ── 金额 (computed) ──
      - name: amount_untaxed
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "不含税合计"

      - name: amount_tax
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "税额"

      - name: amount_total
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "含税合计"

      - name: amount_total_cc
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "公司币种合计"

      # ── 开票 ──
      - name: invoice_count
        type: i32
        rust_type: "Option<i32>"
        flutter_type: "int?"
        nullable: true
        description: "关联发票数"

      - name: invoice_status
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "开票状态"

      # ── 收货提醒 ──
      - name: receipt_reminder_email
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "收货提醒邮件"

      - name: reminder_date_before_receipt
        type: i32
        rust_type: "Option<i32>"
        flutter_type: "int?"
        nullable: true
        description: "收货前提醒天数"

      - name: is_late
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "是否逾期"

      # ── 审计 ──
      - name: active
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        flutter_type: "int"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── PurchaseOrderLine (采购订单行) ──────────────────────────────────
  - name: PurchaseOrderLine
    table: purchase.order_lines
    aggregate_root: false
    parent_entity: PurchaseOrder
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    computed_fields:
      - name: price_subtotal
        description: "不含税小计 = qty * price_unit * (1 - discount/100)"
        depends_on: ["product_qty", "price_unit", "discount"]
      - name: price_tax
        description: "税额"
        depends_on: ["price_subtotal"]
      - name: price_total
        description: "含税合计 = price_subtotal + price_tax"
        depends_on: ["price_subtotal", "price_tax"]

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "PurchaseOrderLine ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: order_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "所属订单"
        relation: purchase.orders

      - name: sequence
        type: i32
        rust_type: "i32"
        nullable: false
        default: 10
        description: "排序"

      - name: product_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "产品"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "行描述"

      - name: product_qty
        type: f64
        rust_type: "f64"
        nullable: false
        description: "数量"

      - name: product_uom_qty
        type: f64
        rust_type: "Option<f64>"
        nullable: true
        description: "单位数量"

      - name: price_unit
        type: f64
        rust_type: "f64"
        nullable: false
        description: "单价"

      - name: discount
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "折扣百分比 (0-100)"

      - name: date_planned
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        nullable: true
        description: "计划到达日期"

      - name: product_uom_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "产品单位"

      - name: price_subtotal
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "不含税小计"

      - name: price_tax
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "税额"

      - name: price_total
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "含税合计"

      # ── 收货/开票追踪 ──
      - name: qty_invoiced
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "已开票数量"

      - name: qty_received_method
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "收货数量计算方式"

      - name: qty_received
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "已收货数量"

      - name: qty_received_manual
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "手动收货数量"

      - name: qty_to_invoice
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "待开票数量"

      - name: partner_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "供应商"

      - name: display_type
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "显示类型 (line_section / line_note / 空=普通行)"

      - name: is_downpayment
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否预付款行"

      # ── 审计 ──
      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

enums:
  - name: PurchaseOrderState
    description: "采购订单状态"
    state_machine: true
    default: Draft
    values:
      - name: Draft
        display: "草稿"
        description: "可自由编辑"
      - name: Confirmed
        display: "已确认"
        description: "不可修改行项，等待收货"
      - name: Done
        display: "已完成"
        description: "终态"
      - name: Cancel
        display: "已取消"
        description: "可重新打开回草稿"
    transitions:
      - from: Draft
        to: [Confirmed, Cancel]
      - from: Confirmed
        to: [Done, Cancel]
      - from: Done
        to: []
      - from: Cancel
        to: [Draft]

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
