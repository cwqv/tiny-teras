# ERP Base 模块 Tera 项目配置
# 版本: v1
# 描述: 基础模块 (Partner, Currency, Country, Bank, Sequence)
#
# 对应 SQL 迁移: dev_infra/migrations/20260301000001_..._20260301000025_*

module:
  name: erp_base
  schema: base
  display_name: "Base"
  description: "ERP 基础模块 — 联系人、货币、国家、银行、序列号"

entities:
  # ─── Partner (联系人 / 公司) ──────────────────────────────────
  - name: Partner
    table: base.partners
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete

    indexed_fields:
      - name
      - email
      - is_company
      - parent_id
      - tenant_id
      - country_id

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        primary_key: true
        description: "Partner ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "Option<String>"
        flutter_type: "String"
        nullable: true
        description: "名称"
        searchable: true
        search_operator: "ILIKE"

      - name: complete_name
        type: String
        rust_type: "Option<String>"
        flutter_type: "String"
        nullable: true
        description: "完整名称"

      - name: parent_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "上级公司"
        relation: base.partners

      - name: ref
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "参考编号"

      - name: lang
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "语言"

      - name: vat
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "税号"
        searchable: true
        search_operator: "ILIKE"

      - name: website
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "网站"

      - name: comment
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "备注"

      - name: active
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: function
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "职位"

      - name: type
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "地址类型 (contact/invoice/delivery/other)"

      - name: street
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "街道"

      - name: street2
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "街道2"

      - name: zip
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "邮编"

      - name: city
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "城市"

      - name: state_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "省/州"
        relation: base.country_states

      - name: country_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "国家"
        relation: base.countries

      - name: email
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "邮箱"
        searchable: true
        search_operator: "ILIKE"

      - name: phone
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "电话"
        searchable: true
        search_operator: "ILIKE"

      - name: is_company
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "是否为公司"
        searchable: true
        search_operator: "="

      - name: company_type
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "公司类型"

      - name: industry_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "行业"
        relation: base.partner_industries

      - name: barcode
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "条形码"

      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: version
        type: i32
        rust_type: "i32"
        flutter_type: "int"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── Currency (货币) ──────────────────────────────────
  - name: Currency
    table: base.currencies
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: false
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Currency ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "货币代码 (ISO 4217, e.g. CNY)"

      - name: full_name
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "货币全名"

      - name: symbol
        type: String
        rust_type: "String"
        nullable: false
        description: "货币符号 (e.g. ￥)"

      - name: rounding
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0.01"
        description: "舍入精度"

      - name: decimal_places
        type: i32
        rust_type: "i32"
        nullable: false
        default: 2
        description: "小数位数"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

  # ─── Country (国家) ──────────────────────────────────
  - name: Country
    table: base.countries
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: false
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Country ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "国家名称"

      - name: code
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "国家代码 (ISO 3166-1 alpha-2)"

      - name: phone_code
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "电话国际区号"

      - name: currency_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "默认货币"
        relation: base.currencies

  # ─── Bank (银行) ──────────────────────────────────
  - name: Bank
    table: base.banks
    aggregate_root: false
    features:
      soft_delete: false
      optimistic_locking: false
      tenant_aware: false
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Bank ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "银行名称"

      - name: bic
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "BIC/SWIFT 代码"

      - name: country_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "所属国家"
        relation: base.countries

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

  # ─── Sequence (序列号生成器) ──────────────────────────────────
  - name: Sequence
    table: base.sequences
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Sequence ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "序列名称 (e.g. Sale Order)"

      - name: code
        type: String
        rust_type: "String"
        nullable: false
        description: "序列代码 (e.g. sale.order)"

      - name: prefix
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "前缀 (e.g. SO/)"

      - name: suffix
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "后缀"

      - name: padding
        type: i32
        rust_type: "i32"
        nullable: false
        default: 5
        description: "编号位数 (e.g. 5 → 00001)"

      - name: number_next
        type: i64
        rust_type: "i64"
        nullable: false
        default: 1
        description: "下一个编号"

      - name: number_increment
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "步长"

      - name: use_date_range
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否按日期范围"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
