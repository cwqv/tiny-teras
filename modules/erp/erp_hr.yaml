# ERP HR 模块 Tera 项目配置
# 版本: v1
# 描述: 人力资源模块 (Employee, Department, Job)
#
# 对应 Rust domain: core_rust/crates/libs/erp/erp_hr/src/domain/entities/

module:
  name: erp_hr
  schema: hr
  display_name: "HR"
  description: "ERP 人力资源模块 — 员工、部门（层级）、职位"

entities:
  # ─── Employee (员工) ──────────────────────────────────
  - name: Employee
    table: hr.employees
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - Archive
      - Unarchive

    indexed_fields:
      - name
      - department_id
      - job_id
      - parent_id
      - work_email
      - tenant_id
      - active

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Employee ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "员工姓名"
        searchable: true
        search_operator: "ILIKE"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: employee_type
        type: String
        rust_type: "EmployeeType"
        nullable: false
        default: "employee"
        description: "员工类型 (employee/freelancer/student/intern)"

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色标识"

      # ── 工作信息 ──
      - name: job_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "关联职位"
        relation: hr.jobs

      - name: department_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "关联部门"
        relation: hr.departments

      - name: parent_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "直接经理 (自引用)"
        relation: hr.employees

      - name: coach_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "教练/导师 (自引用)"
        relation: hr.employees

      # ── 联系方式 ──
      - name: work_phone
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "工作电话"

      - name: mobile_phone
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "手机号"

      - name: work_email
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "工作邮箱"
        searchable: true
        search_operator: "ILIKE"

      - name: work_contact_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "关联合作伙伴记录"
        relation: base.partners

      - name: work_location_type
        type: String
        rust_type: "Option<WorkLocationType>"
        nullable: true
        description: "工作地点类型 (home/office/other)"

      # ── 用户关联 ──
      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "关联用户"

      # ── 身份标识 ──
      - name: barcode
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "条码"

      - name: pin
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "PIN"

      # ── 私人信息 ──
      - name: birthday
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        nullable: true
        description: "生日"

      - name: country_of_birth
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "出生国家"
        relation: base.countries

      - name: certificate
        type: String
        rust_type: "Option<CertificateLevel>"
        nullable: true
        description: "学历 (graduate/bachelor/master/doctor/other)"

      - name: study_field
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "专业"

      - name: study_school
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "毕业院校"

      # ── 紧急联系人 ──
      - name: emergency_contact
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "紧急联系人"

      - name: emergency_phone
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "紧急联系电话"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── Department (部门，自引用层级) ──────────────────────────────────
  - name: Department
    table: hr.departments
    aggregate_root: true
    hierarchical: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - Create
      - Update
      - Delete
      - Archive
      - Unarchive
      - GetTree

    computed_fields:
      - name: complete_name
        description: "完整路径名 (自动拼接: Engineering / Frontend Team)"
        depends_on: ["name", "parent_id"]

    indexed_fields:
      - name
      - parent_id
      - manager_id
      - tenant_id

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Department ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "部门名称"
        searchable: true
        search_operator: "ILIKE"

      - name: complete_name
        type: String
        rust_type: "String"
        nullable: false
        description: "完整路径名 (e.g. Engineering / Frontend Team)"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: parent_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "父部门 (自引用，NULL = 顶级部门)"
        relation: hr.departments

      - name: manager_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "部门经理"
        relation: hr.employees

      - name: color
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "颜色标识"

      - name: note
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "备注"

      - name: parent_path
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "MaterializedPath (用于快速层级查询)"

      - name: master_department_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "主部门 (多公司场景)"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── Job (职位) ──────────────────────────────────
  - name: Job
    table: hr.jobs
    aggregate_root: true
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: false

    service_methods:
      - Get
      - List
      - Create
      - Update
      - Delete
      - Archive
      - Unarchive

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "Job ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "职位名称"
        searchable: true
        search_operator: "ILIKE"

      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: department_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "所属部门"
        relation: hr.departments

      - name: sequence
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "排序序号"

      - name: no_of_recruitment
        type: i32
        rust_type: "Option<i32>"
        nullable: true
        description: "招聘目标人数"

      - name: description
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "职位描述"

      - name: requirements
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "任职要求"

      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "招聘负责人"

      - name: contract_type_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "关联合同类型"

      # ── 审计 ──
      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

enums:
  - name: EmployeeType
    description: "员工类型"
    state_machine: false
    default: Employee
    values:
      - name: Employee
        display: "正式员工"
        db_value: "employee"
      - name: Freelancer
        display: "自由职业者"
        db_value: "freelancer"
      - name: Student
        display: "学生/实习生"
        db_value: "student"
      - name: Intern
        display: "实习"
        db_value: "intern"

  - name: CertificateLevel
    description: "学历等级"
    state_machine: false
    default: Graduate
    values:
      - name: Graduate
        display: "毕业"
      - name: Bachelor
        display: "学士"
      - name: Master
        display: "硕士"
      - name: Doctor
        display: "博士"
      - name: Other
        display: "其他"

  - name: WorkLocationType
    description: "工作地点类型"
    state_machine: false
    default: Home
    values:
      - name: Home
        display: "居家"
      - name: Office
        display: "办公室"
      - name: Other
        display: "其他"

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
