# ERP Sale 模块 Tera 项目配置
# 版本: v1
# 描述: 销售模块 (SaleOrder, SaleOrderLine, SaleOrderState)
#
# 对应 Rust domain: core_rust/crates/libs/erp/erp_sale/src/domain/entities/

module:
  name: erp_sale
  schema: sale
  display_name: "Sale"
  description: "ERP 销售模块 — 销售订单、订单行、状态机"

entities:
  # ─── SaleOrder (销售订单聚合根) ──────────────────────────────────
  - name: SaleOrder
    table: sale.orders
    aggregate_root: true
    pattern: header-line
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    service_methods:
      - Get
      - List
      - GetPaged
      - Create
      - Update
      - Delete
      - Confirm
      - Cancel
      - Lock

    domain_events:
      - SaleOrderConfirmed
      - SaleOrderCancelled

    computed_fields:
      - name: amount_untaxed
        description: "不含税合计 = Σ line.price_subtotal"
        depends_on: ["lines.price_subtotal"]
      - name: amount_tax
        description: "税额 = Σ line.price_tax"
        depends_on: ["lines.price_tax"]
      - name: amount_total
        description: "含税合计 = amount_untaxed + amount_tax"
        depends_on: ["amount_untaxed", "amount_tax"]

    indexed_fields:
      - name
      - partner_id
      - state
      - date_order
      - tenant_id
      - user_id

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        primary_key: true
        description: "SaleOrder ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "租户 ID"

      - name: name
        type: String
        rust_type: "String"
        flutter_type: "String"
        nullable: false
        description: "订单编号 (SO/2026/00001)"
        searchable: true
        search_operator: "ILIKE"

      - name: partner_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "客户"
        relation: base.partners

      - name: state
        type: String
        rust_type: "SaleOrderState"
        flutter_type: "String"
        nullable: false
        default: "draft"
        description: "状态 (draft/confirmed/locked/done/cancel)"

      - name: locked
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "已锁定标志"

      - name: client_order_ref
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "客户参考号"

      - name: commitment_date
        type: Timestamp
        rust_type: "Option<chrono::DateTime<chrono::Utc>>"
        flutter_type: "DateTime?"
        nullable: true
        description: "承诺交付日期"

      - name: date_order
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "订单日期"

      - name: origin
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "来源单据"

      - name: reference
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "付款参考"

      - name: validity_date
        type: Date
        rust_type: "Option<chrono::NaiveDate>"
        flutter_type: "DateTime?"
        nullable: true
        description: "有效期"

      - name: note
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "备注 / 条款"

      - name: partner_invoice_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "发票地址"
        relation: base.partners

      - name: partner_shipping_id
        type: Uuid
        rust_type: "uuid::Uuid"
        flutter_type: "String"
        nullable: false
        description: "交付地址"
        relation: base.partners

      - name: pricelist_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "价格表"

      - name: currency_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "币种"
        relation: base.currencies

      - name: currency_rate
        type: f64
        rust_type: "Option<f64>"
        flutter_type: "double?"
        nullable: true
        description: "汇率"

      - name: payment_term_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "付款条件"

      - name: fiscal_position_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "财务位置"

      - name: journal_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "开票日志"

      - name: user_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "销售员"

      - name: team_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "销售团队"

      # ── 金额 (computed) ──
      - name: amount_untaxed
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "不含税合计"

      - name: amount_tax
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "税额"

      - name: amount_total
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        flutter_type: "double"
        nullable: false
        default: "0"
        description: "含税合计"

      - name: invoice_status
        type: String
        rust_type: "Option<String>"
        flutter_type: "String?"
        nullable: true
        description: "开票状态"

      # ── 签名 ──
      - name: require_signature
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "是否需要签名"

      - name: require_payment
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "false"
        description: "是否需要付款"

      - name: prepayment_percent
        type: f64
        rust_type: "Option<f64>"
        flutter_type: "double?"
        nullable: true
        description: "预付款百分比"

      # ── 审计 ──
      - name: active
        type: bool
        rust_type: "bool"
        flutter_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        flutter_type: "DateTime"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        flutter_type: "String?"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        flutter_type: "int"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

  # ─── SaleOrderLine (销售订单行) ──────────────────────────────────
  - name: SaleOrderLine
    table: sale.order_lines
    aggregate_root: false
    parent_entity: SaleOrder
    features:
      soft_delete: false
      optimistic_locking: true
      tenant_aware: true
      sync_support: true

    computed_fields:
      - name: price_subtotal
        description: "不含税小计 = qty * price_unit * (1 - discount/100)"
        depends_on: ["product_uom_qty", "price_unit", "discount"]
      - name: price_tax
        description: "税额"
        depends_on: ["price_subtotal"]
      - name: price_total
        description: "含税合计 = price_subtotal + price_tax"
        depends_on: ["price_subtotal", "price_tax"]

    fields:
      - name: id
        type: Uuid
        rust_type: "uuid::Uuid"
        primary_key: true
        description: "SaleOrderLine ID"

      - name: tenant_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "租户 ID"

      - name: order_id
        type: Uuid
        rust_type: "uuid::Uuid"
        nullable: false
        description: "所属订单"
        relation: sale.orders

      - name: sequence
        type: i32
        rust_type: "i32"
        nullable: false
        default: 10
        description: "排序"

      - name: product_id
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "产品"

      - name: name
        type: String
        rust_type: "String"
        nullable: false
        description: "行描述"

      - name: product_uom_qty
        type: f64
        rust_type: "f64"
        nullable: false
        description: "数量"

      - name: price_unit
        type: f64
        rust_type: "f64"
        nullable: false
        description: "单价"

      - name: discount
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "折扣百分比 (0-100)"

      - name: price_subtotal
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "不含税小计"

      - name: price_tax
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "税额"

      - name: price_total
        type: Decimal
        rust_type: "rust_decimal::Decimal"
        nullable: false
        default: "0"
        description: "含税合计"

      - name: customer_lead
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "前置时间(天)"

      - name: qty_delivered
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "已交付数量"

      - name: qty_invoiced
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "已开票数量"

      - name: qty_to_invoice
        type: f64
        rust_type: "f64"
        nullable: false
        default: "0"
        description: "待开票数量"

      - name: invoice_status
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "行级开票状态"

      - name: display_type
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "显示类型 (line_section / line_note / 空=普通行)"

      - name: is_downpayment
        type: bool
        rust_type: "bool"
        nullable: false
        default: "false"
        description: "是否预付款行"

      - name: state
        type: String
        rust_type: "Option<String>"
        nullable: true
        description: "状态 (继承自订单)"

      # ── 审计 ──
      - name: active
        type: bool
        rust_type: "bool"
        nullable: false
        default: "true"
        description: "是否启用"

      - name: created_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "创建时间"

      - name: updated_at
        type: Timestamp
        rust_type: "chrono::DateTime<chrono::Utc>"
        nullable: false
        default: "now"
        description: "更新时间"

      - name: created_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "创建人"

      - name: updated_by
        type: Uuid
        rust_type: "Option<uuid::Uuid>"
        nullable: true
        description: "更新人"

      - name: version
        type: i32
        rust_type: "i32"
        nullable: false
        default: 1
        description: "版本号（乐观锁）"

enums:
  - name: SaleOrderState
    description: "销售订单状态"
    state_machine: true
    default: Draft
    values:
      - name: Draft
        display: "草稿"
        description: "可自由编辑"
      - name: Confirmed
        display: "已确认"
        description: "不可修改行项，可锁定或取消"
      - name: Locked
        display: "已锁定"
        description: "完全锁定，等待完成"
      - name: Done
        display: "已完成"
        description: "终态"
      - name: Cancel
        display: "已取消"
        description: "可重新打开回草稿"
    transitions:
      - from: Draft
        to: [Confirmed, Cancel]
      - from: Confirmed
        to: [Locked, Done, Cancel]
      - from: Locked
        to: [Done, Cancel]
      - from: Done
        to: []
      - from: Cancel
        to: [Draft]

task_groups:
  backend:
    - domain_entity
    - domain_repository
    - infrastructure_repository
    - application_command
    - application_query
    - application_dto
    - application_service
  proto:
    - proto_service
  frontend:
    - flutter_list_page
    - flutter_form_page
